[project]
name = "opentrial"
version = "0.1.0"
description = "Bayesian clinical trial design engine with cited evidence provenance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "streamlit>=1.36",
]

[project.scripts]
opentrial-web = "opentrial.web:main"

[tool.setuptools.package-data]
opentrial = ["static/*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
# Optional PyMC Bayesian meta-analysis engine (compute/bayes.py). Heavy; not needed
# for the deterministic default path or the offline test suite.
bayes = [
  "pymc>=5",
  "numpy>=1.26",
]
# Optional PDF export (report/pdf.py). Pure-Python, no system dependencies; the report
# still renders as Markdown and JSON without it.
pdf = [
  "fpdf2>=2.7",
]
# Optional independent validation (validation/scipy_crosscheck.py). Cross-checks the
# stdlib-only engine against SciPy and statsmodels. Not used by the engine or the test suite.
validation = [
  "numpy>=1.26",
  "scipy>=1.11",
  "statsmodels>=0.14",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
